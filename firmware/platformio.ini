; =============================================================================
;  AI Orb firmware - live Claude Code session status on a round GC9A01
;
;  Envs:
;    esp32s3_round        ESP32-S3 Super Mini + bare 7-pin GC9A01 1.28" module
;                         (same wiring as the BambuHelper esp32s3_round env)
;    waveshare_s3_lcd128  Waveshare ESP32-S3-LCD-1.28 (integrated GC9A01)
;                         UNTESTED on hardware - pins from the vendor pinout.
;
;    esp32s3_round_demo   esp32s3_round playing a scripted ~2 min loop through
;                         every screen with made-up sessions (for videos)
;
;  Build:   pio run -e esp32s3_round
;  Flash:   pio run -e esp32s3_round -t upload
;  Monitor: pio device monitor -e esp32s3_round
;
;  Every pin / panel option is a -D flag below, so another wiring is a
;  one-line change. PIN_* = -1 means "not connected".
; =============================================================================

[platformio]
default_envs = esp32s3_round

[common]
lib_deps =
    lovyan03/LovyanGFX@^1.2.19
    bblanchon/ArduinoJson@^7.0
build_flags =
    -D FW_VERSION=\"0.1.0\"
    -D CORE_DEBUG_LEVEL=0
    ; The 240x240x16bpp frame buffer (113 KB) goes to PSRAM when present.
    ; Uncomment to try internal SRAM first (faster blending; less heap left
    ; for Wi-Fi/HTTP). Serial logs fps + us/frame every 10 s to compare.
    ; -D ORB_CANVAS_SRAM_FIRST=1

; Shared ESP32-S3 profile (4 MB layout; also fine on 8/16 MB parts)
[s3_base]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_qspi
; Single 3 MB app slot, no OTA, NVS for settings. No filesystem needed.
board_build.partitions = huge_app.csv
lib_deps = ${common.lib_deps}
; Warnings for our own sources only (libraries keep their defaults).
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

; -----------------------------------------------------------------------------
;  ESP32-S3 Super Mini + GC9A01 (7-pin module, no backlight pin)
;    SCL=GPIO12  SDA(MOSI)=GPIO11  DC=GPIO9  CS=GPIO10  RES=GPIO8
; -----------------------------------------------------------------------------
[env:esp32s3_round]
extends = s3_base
board = lolin_s3_mini
build_flags =
    ${common.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_NAME=\"esp32s3_round\"
    -D PIN_SCLK=12
    -D PIN_MOSI=11
    -D PIN_DC=9
    -D PIN_CS=10
    -D PIN_RST=8
    -D PIN_BL=-1
    ; Optional push button to GND (internal pull-up). -1 = disabled.
    ; Short press = next page/session, long press = device info.
    -D PIN_BUTTON=-1
    ; GC9A01 modules ship colour-inverted; flip to 0 if colours look negative.
    -D PANEL_INVERT=1
    ; 0 = RGB, 1 = BGR. Flip if red and blue are swapped.
    -D PANEL_RGB_ORDER=0
    -D PANEL_SPI_FREQ=40000000

; Same board, no Claude Code needed: mock sessions loop through every screen.
; Real pushes are answered but ignored. Wi-Fi still runs for the clock.
[env:esp32s3_round_demo]
extends = env:esp32s3_round
build_flags =
    ${env:esp32s3_round.build_flags}
    -D ORB_DEMO=1

; -----------------------------------------------------------------------------
;  Waveshare ESP32-S3-LCD-1.28 (ESP32-S3R2, 16 MB flash, 2 MB PSRAM)
;    SCLK=GPIO10 MOSI=GPIO11 CS=GPIO9 DC=GPIO8 RST=GPIO14 BL=GPIO2 (PWM)
;  UNTESTED: pins are from the vendor schematic, not verified on hardware.
; -----------------------------------------------------------------------------
[env:waveshare_s3_lcd128]
extends = s3_base
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
build_flags =
    ${common.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_NAME=\"waveshare_s3_lcd128\"
    -D PIN_SCLK=10
    -D PIN_MOSI=11
    -D PIN_DC=8
    -D PIN_CS=9
    -D PIN_RST=14
    -D PIN_BL=2
    -D PIN_BUTTON=-1
    -D PANEL_INVERT=1
    -D PANEL_RGB_ORDER=0
    -D PANEL_SPI_FREQ=40000000
